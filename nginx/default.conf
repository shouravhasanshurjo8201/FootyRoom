upstream backend {
    # Default algorithm: round robin.
    # Switch to least connections with: least_conn;
    # Switch to IP-hash with: ip_hash;
    server backend-1:8000 max_fails=3 fail_timeout=10s;
    server backend-2:8000 max_fails=3 fail_timeout=10s;
    server backend-3:8000 max_fails=3 fail_timeout=10s;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;

    location /api/v1/ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://frontend;
    }
}

